<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Historia LO 2 — „Złoty wiek” Rzeczypospolitej</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #15110a;
    --card-front: #f7f2e7;
    --card-back: #2a2112;
    --accent: #c08a1e;
    --accent-light: #f0cf7e;
    --text-dark: #2a2112;
    --text-light: #f1f4f6;
    --text-muted: #a89a80;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text-light);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    user-select: none;
  }

  .header {
    width: 100%;
    max-width: 480px;
    padding: 28px 24px 8px;
    text-align: center;
  }
  .header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.45rem;
    color: var(--accent-light);
    letter-spacing: 0.02em;
  }
  .header .subtitle {
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-top: 6px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  .filters {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 14px 20px 6px;
  }
  .topic-bar {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .topic-bar::-webkit-scrollbar { display: none; }
  .topic-pill {
    flex-shrink: 0;
    padding: 6px 13px;
    border-radius: 20px;
    border: 1px solid #3d3220;
    background: transparent;
    color: var(--text-muted);
    font-size: 0.72rem;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s;
    white-space: nowrap;
  }
  .topic-pill.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
  }

  .progress-area {
    width: 100%;
    max-width: 480px;
    padding: 10px 24px 4px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .progress-track {
    flex: 1;
    height: 3px;
    background: #3d3220;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.4s ease;
  }
  .progress-label {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-weight: 500;
    min-width: 48px;
    text-align: right;
  }

  .card-container {
    width: 100%;
    max-width: 480px;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px 24px;
    perspective: 1000px;
  }

  .card {
    width: 100%;
    aspect-ratio: 3 / 4;
    max-height: 420px;
    position: relative;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .card.flipped { transform: rotateY(180deg); }
  .card.slide-left { animation: slideLeft 0.35s ease both; }
  .card.slide-right { animation: slideRight 0.35s ease both; }
  @keyframes slideLeft {
    0% { opacity: 1; transform: translateX(0); }
    40% { opacity: 0; transform: translateX(-60px); }
    60% { opacity: 0; transform: translateX(60px); }
    100% { opacity: 1; transform: translateX(0); }
  }
  @keyframes slideRight {
    0% { opacity: 1; transform: translateX(0); }
    40% { opacity: 0; transform: translateX(60px); }
    60% { opacity: 0; transform: translateX(-60px); }
    100% { opacity: 1; transform: translateX(0); }
  }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    padding: 26px 22px;
    overflow-y: auto;
  }

  .card-front {
    background: var(--card-front);
    color: var(--text-dark);
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
  }
  .card-front .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: auto;
  }
  .card-front .card-topic {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--accent);
    font-weight: 600;
  }
  .card-front .card-question {
    font-family: 'DM Serif Display', serif;
    font-size: 1.1rem;
    line-height: 1.5;
    text-align: center;
    padding: 0 2px;
  }
  .card-front .tap-hint {
    font-size: 0.7rem;
    color: #7d8b97;
    text-align: center;
    margin-top: auto;
    padding-top: 14px;
  }
  .card-back {
    background: var(--card-back);
    color: var(--text-light);
    transform: rotateY(180deg);
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  }
  .card-back .card-topic {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .card-back .answer-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-bottom: 14px;
    font-weight: 600;
  }
  .card-back .answer-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 11px;
    flex: 1;
    justify-content: center;
  }
  .card-back .answer-list li {
    position: relative;
    padding-left: 18px;
    font-size: 0.86rem;
    line-height: 1.5;
    color: var(--accent-light);
  }
  .card-back .answer-list li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 8px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
  }
  .card-back .tap-hint {
    font-size: 0.7rem;
    color: var(--text-muted);
    text-align: center;
    margin-top: auto;
    padding-top: 12px;
  }

  .topic-pill.known-pill {
    border-style: dashed;
    border-color: var(--accent);
    color: var(--accent-light);
  }
  .topic-pill.known-pill.active {
    background: var(--accent);
    border-style: solid;
    color: #ffffff;
  }

  .stats-row {
    width: 100%;
    max-width: 480px;
    padding: 4px 24px 0;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
    font-size: 0.72rem;
    color: var(--text-muted);
    min-height: 16px;
  }
  .link-btn {
    background: none;
    border: none;
    padding: 0;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.72rem;
    color: var(--accent-light);
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }

  .nav-area {
    width: 100%;
    max-width: 480px;
    padding: 6px 24px 34px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }
  .nav-btn {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: 1.5px solid #3d3220;
    background: transparent;
    color: var(--text-muted);
    font-size: 1.3rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .nav-btn:active {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
    transform: scale(0.92);
  }
  .nav-btn:disabled { opacity: 0.2; pointer-events: none; }
  .shuffle-btn {
    padding: 11px 22px;
    border-radius: 28px;
    border: 1.5px solid #3d3220;
    background: transparent;
    color: var(--text-muted);
    font-size: 0.78rem;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.08em;
    transition: all 0.2s;
  }
  .shuffle-btn:active {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
  }
  .mark-btn {
    padding: 11px 18px;
    border-radius: 28px;
    border: 1.5px solid var(--accent);
    background: transparent;
    color: var(--accent-light);
    font-size: 0.78rem;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.06em;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .mark-btn:active {
    background: var(--accent);
    color: #ffffff;
    transform: scale(0.95);
  }
  .mark-btn:disabled { opacity: 0.25; pointer-events: none; }

  @media (max-width: 400px) {
    .nav-area { gap: 8px; padding: 6px 14px 30px; }
    .nav-btn { width: 46px; height: 46px; font-size: 1.15rem; }
    .shuffle-btn, .mark-btn { padding: 10px 12px; font-size: 0.7rem; letter-spacing: 0.03em; }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .header { animation: fadeUp 0.5s ease both; }
  .filters { animation: fadeUp 0.5s 0.05s ease both; }
  .progress-area { animation: fadeUp 0.5s 0.1s ease both; }
  .card-container { animation: fadeUp 0.5s 0.2s ease both; }
  .stats-row { animation: fadeUp 0.5s 0.15s ease both; }
  .nav-area { animation: fadeUp 0.5s 0.3s ease both; }
</style>
</head>
<body>

<div class="header">
  <h1>„Złoty wiek” Rzeczypospolitej</h1>
  <div class="subtitle">Historia &middot; rozdział II &middot; 45 pytań</div>
</div>

<div class="filters">
  <div class="topic-bar" id="topicBar"></div>
</div>

<div class="progress-area">
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel"></div>
</div>

<div class="stats-row" id="statsRow"></div>

<div class="card-container">
  <div class="card" id="card">
    <div class="card-face card-front" id="cardFront"></div>
    <div class="card-face card-back" id="cardBack"></div>
  </div>
</div>

<div class="nav-area">
  <button class="nav-btn" id="prevBtn" onclick="prevCard()">&#8592;</button>
  <button class="mark-btn" id="markBtn" onclick="toggleKnown()">&#10003; Umiem</button>
  <button class="shuffle-btn" onclick="shuffleDeck()">Losuj</button>
  <button class="nav-btn" id="nextBtn" onclick="nextCard()">&#8594;</button>
</div>

<script>
var ALL_FLASHCARDS = [
  { topic: "Ostatni Jagiellonowie", q: "Którzy synowie Kazimierza Jagiellończyka kolejno rządzili Polską?", a: ["Jan Olbracht → Aleksander → Zygmunt I Stary"] },
  { topic: "Ostatni Jagiellonowie", q: "Kto był ostatnim królem z dynastii Jagiellonów?", a: ["<b>Zygmunt II August</b> (1548–1572)"] },
  { topic: "Ostatni Jagiellonowie", q: "Kto i z kim wygrał bitwę pod Orszą (1514)?", a: ["Konstanty Ostrogski — armia polsko-litewska pokonała <b>Moskwę</b>"] },
  { topic: "Ostatni Jagiellonowie", q: "Co ustalono na zjeździe wiedeńskim (1515)?", a: ["Habsburgowie przestali wspierać Moskwę i Krzyżaków; w zamian Jagiellonowie zgodzili się na układ małżeński z Habsburgami"] },
  { topic: "Ostatni Jagiellonowie", q: "Czym był hołd pruski?", a: ["<b>1525 r.</b>, Kraków — Albrecht Hohenzollern został lennikiem Polski jako książę pruski"] },
  { topic: "Ostatni Jagiellonowie", q: "Kim była Bona Sforza?", a: ["Włoska żona Zygmunta Starego, matka Zygmunta Augusta"] },
  { topic: "Ostatni Jagiellonowie", q: "O co toczyła się I wojna północna (1563–1570)?", a: ["O <b>Inflanty</b> — Rzeczpospolita zdobyła większość ich terytorium"] },
  { topic: "Odrodzenie", q: "Jaki zamek przebudowano w XVI w. w stylu renesansowym?", a: ["<b>Wawel</b> — z Kaplicą Zygmuntowską"] },
  { topic: "Odrodzenie", q: "Czego dokonał Mikołaj Kopernik?", a: ["Ogłosił <b>teorię heliocentryczną</b> (1543)"] },
  { topic: "Odrodzenie", q: "Kogo nazywa się „ojcem literatury polskiej”?", a: ["<b>Mikołaja Reja</b>"] },
  { topic: "Odrodzenie", q: "Kto napisał „Treny” i „Odprawę posłów greckich”?", a: ["<b>Jan Kochanowski</b>"] },
  { topic: "Odrodzenie", q: "Kto napisał „O poprawie Rzeczypospolitej”?", a: ["<b>Andrzej Frycz Modrzewski</b>"] },
  { topic: "Demokracja szlachecka", q: "Co oznacza zasada <i>neminem captivabimus</i>?", a: ["Nie wolno uwięzić szlachcica bez wyroku sądu"] },
  { topic: "Demokracja szlachecka", q: "Co dawały szlachcie przywileje cerekwicko-nieszawskie (1454)?", a: ["Bez zgody sejmików król nie mógł zwołać pospolitego ruszenia ani wprowadzać nowych praw i podatków"] },
  { topic: "Demokracja szlachecka", q: "Co postanowiła konstytucja <i>Nihil novi</i> (1505)?", a: ["Nic nowego bez zgody sejmu"] },
  { topic: "Demokracja szlachecka", q: "Jakie trzy stany sejmujące tworzyły sejm walny?", a: ["<b>Król</b>, <b>senat</b> i <b>izba poselska</b>"] },
  { topic: "Demokracja szlachecka", q: "Kiedy odbył się pierwszy sejm walny?", a: ["W <b>1468 r.</b> (Piotrków)"] },
  { topic: "Demokracja szlachecka", q: "Skąd brali się posłowie w izbie poselskiej?", a: ["Wybierano ich na <b>sejmikach</b>"] },
  { topic: "Demokracja szlachecka", q: "Jaki procent społeczeństwa stanowiła szlachta w XVI w.?", a: ["Ok. <b>6–7%</b>"] },
  { topic: "Demokracja szlachecka", q: "Jak nazywała się najbogatsza, a jak najbiedniejsza grupa szlachty?", a: ["Najbogatsza — <b>magnateria</b>; najbiedniejsza — <b>gołota</b>"] },
  { topic: "Demokracja szlachecka", q: "Czym była wojna kokosza (1537)?", a: ["<b>Rokoszem</b> — buntem szlachty przeciw królowi pod Lwowem"] },
  { topic: "Demokracja szlachecka", q: "Czego domagał się ruch egzekucyjny?", a: ["Zwrotu <b>królewszczyzn</b> zagarniętych przez magnatów"] },
  { topic: "Reformacja", q: "Kto w Polsce przyjmował luteranizm, a kto kalwinizm?", a: ["Luteranizm — mieszczanie (Gdańsk, Toruń, Elbląg)", "Kalwinizm — szlachta i magnaci"] },
  { topic: "Reformacja", q: "Czego nie uznawali bracia polscy (arianie)?", a: ["<b>Trójcy Świętej</b>"] },
  { topic: "Reformacja", q: "Czym była ugoda sandomierska (1570)?", a: ["Porozumieniem protestantów (bez arian)"] },
  { topic: "Reformacja", q: "Co zapewniła konfederacja warszawska (1573)?", a: ["<b>Wolność religijną</b> i pokój między wyznaniami"] },
  { topic: "Reformacja", q: "Dlaczego Rzeczpospolitą nazywano „państwem bez stosów”?", a: ["Nie palono innowierców i nie było wojen religijnych"] },
  { topic: "Reformacja", q: "Kto sprowadził jezuitów do Polski?", a: ["Kardynał <b>Stanisław Hozjusz</b> (1564)"] },
  { topic: "Reformacja", q: "Jaki Kościół powstał w wyniku unii brzeskiej (1596)?", a: ["<b>Kościół greckokatolicki</b>"] },
  { topic: "Społeczeństwo i gospodarka", q: "Jakie cztery stany tworzyły społeczeństwo Rzeczypospolitej?", a: ["Szlachta, duchowieństwo, mieszczaństwo, chłopstwo"] },
  { topic: "Społeczeństwo i gospodarka", q: "Który stan był najliczniejszy?", a: ["<b>Chłopi</b> (ok. 78%)"] },
  { topic: "Społeczeństwo i gospodarka", q: "Co to jest folwark?", a: ["Duże gospodarstwo szlachcica, uprawiające zboże na sprzedaż"] },
  { topic: "Społeczeństwo i gospodarka", q: "Co to jest pańszczyzna?", a: ["Darmowa, przymusowa praca chłopa na polu pana"] },
  { topic: "Społeczeństwo i gospodarka", q: "Dlaczego w Polsce rozwinęły się folwarki?", a: ["Europa Zachodnia kupowała coraz więcej <b>zboża</b>"] },
  { topic: "Społeczeństwo i gospodarka", q: "Które miasto było największym portem i ośrodkiem handlu Rzeczypospolitej?", a: ["<b>Gdańsk</b>"] },
  { topic: "Społeczeństwo i gospodarka", q: "Co było głównym towarem eksportowym Rzeczypospolitej?", a: ["<b>Zboże</b>"] },
  { topic: "Unia lubelska i elekcja", q: "Dlaczego doszło do unii lubelskiej?", a: ["Litwa potrzebowała pomocy przeciw <b>Moskwie</b>, a Zygmunt August nie miał dzieci"] },
  { topic: "Unia lubelska i elekcja", q: "Kiedy zawarto unię lubelską?", a: ["<b>1569 r.</b>"] },
  { topic: "Unia lubelska i elekcja", q: "Co było wspólne dla Polski i Litwy po unii lubelskiej?", a: ["Król, sejm, moneta i polityka zagraniczna"] },
  { topic: "Unia lubelska i elekcja", q: "Kto zastępował króla w czasie bezkrólewia?", a: ["<b>Interrex</b> — prymas"] },
  { topic: "Unia lubelska i elekcja", q: "Na którym sejmie wybierano króla?", a: ["Na sejmie <b>elekcyjnym</b>"] },
  { topic: "Unia lubelska i elekcja", q: "Co oznacza elekcja <i>viritim</i>?", a: ["Każdy szlachcic mógł osobiście głosować na króla"] },
  { topic: "Unia lubelska i elekcja", q: "Kto wygrał pierwszą wolną elekcję (1573)?", a: ["<b>Henryk Walezy</b>"] },
  { topic: "Unia lubelska i elekcja", q: "Czym różnią się artykuły henrykowskie od pacta conventa?", a: ["Artykuły henrykowskie — stałe prawa dla każdego króla", "Pacta conventa — osobiste obietnice danego króla"] },
  { topic: "Unia lubelska i elekcja", q: "Dlaczego Henryk Walezy uciekł z Polski?", a: ["Żeby objąć tron Francji po śmierci brata"] }
];

// --- Engine ---
var TOPICS = ["Wszystkie"];
var seen = {};
for (var i = 0; i < ALL_FLASHCARDS.length; i++) {
  var t = ALL_FLASHCARDS[i].topic;
  if (!seen[t]) { seen[t] = true; TOPICS.push(t); }
}

var DECK_ID = 'historia_zloty_wiek_rzeczypospolitej';
var STORE_KEY = 'fiszki:' + DECK_ID + ':opanowane';
var KNOWN_VIEW = "__odlozone__";

var activeTopic = "Wszystkie";
var known = loadKnown();
var filteredCards = [];
var currentIndex = 0;
var isFlipped = false;
var isAnimating = false;

var card = document.getElementById('card');
var cardFront = document.getElementById('cardFront');
var cardBack = document.getElementById('cardBack');
var progressFill = document.getElementById('progressFill');
var progressLabel = document.getElementById('progressLabel');
var prevBtn = document.getElementById('prevBtn');
var nextBtn = document.getElementById('nextBtn');
var topicBar = document.getElementById('topicBar');
var markBtn = document.getElementById('markBtn');
var statsRow = document.getElementById('statsRow');

function applyFilters() {
  var cards = [];
  for (var i = 0; i < ALL_FLASHCARDS.length; i++) {
    var f = ALL_FLASHCARDS[i];
    var isKnown = !!known[cardId(f)];
    if (isKnownView()) {
      if (!isKnown) continue;
    } else {
      if (isKnown) continue;
      if (activeTopic !== "Wszystkie" && f.topic !== activeTopic) continue;
    }
    cards.push(f);
  }
  filteredCards = cards;
  currentIndex = 0;
  isFlipped = false;
  card.classList.remove('flipped');
  renderCard();
}

function buildTopicBar() {
  topicBar.innerHTML = '';
  for (var i = 0; i < TOPICS.length; i++) {
    var t = TOPICS[i];
    var pill = document.createElement('button');
    pill.className = 'topic-pill' + (t === activeTopic ? ' active' : '');
    pill.textContent = t;
    pill.setAttribute('data-topic', t);
    pill.onclick = function() {
      activeTopic = this.getAttribute('data-topic');
      buildTopicBar();
      applyFilters();
    };
    topicBar.appendChild(pill);
    if (i === 0) appendKnownPill();
  }
}

function appendKnownPill() {
  var kn = knownCount();
  if (kn === 0) return;
  var knownPill = document.createElement('button');
  knownPill.className = 'topic-pill known-pill' + (isKnownView() ? ' active' : '');
  knownPill.innerHTML = '&#10003; Odłożone (' + kn + ')';
  knownPill.setAttribute('data-topic', KNOWN_VIEW);
  knownPill.onclick = function() {
    activeTopic = this.getAttribute('data-topic');
    buildTopicBar();
    applyFilters();
  };
  topicBar.appendChild(knownPill);
}

// --- odkładanie opanowanych fiszek ---
function cardId(f) { return f.q; }
function isKnownView() { return activeTopic === KNOWN_VIEW; }

function loadKnown() {
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (!raw) return {};
    var arr = JSON.parse(raw);
    var map = {};
    for (var i = 0; i < arr.length; i++) map[arr[i]] = true;
    return map;
  } catch (e) { return {}; }
}

function saveKnown() {
  try {
    var arr = [];
    for (var k in known) { if (known[k]) arr.push(k); }
    localStorage.setItem(STORE_KEY, JSON.stringify(arr));
  } catch (e) {}
}

function knownCount() {
  var n = 0;
  for (var i = 0; i < ALL_FLASHCARDS.length; i++) {
    if (known[cardId(ALL_FLASHCARDS[i])]) n++;
  }
  return n;
}

function plural(n, one, few, many) {
  var n10 = n % 10, n100 = n % 100;
  if (n === 1) return one;
  if (n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14)) return few;
  return many;
}

function updateStats() {
  var n = knownCount();
  if (n === 0) { statsRow.innerHTML = ''; return; }
  statsRow.innerHTML =
    '<span>' + n + ' ' + plural(n, 'fiszka odłożona', 'fiszki odłożone', 'fiszek odłożonych') + '</span>' +
    '<button class="link-btn" onclick="restoreAll()">Przywróć wszystkie</button>';
}

function toggleKnown() {
  if (isAnimating || filteredCards.length === 0) return;
  var id = cardId(filteredCards[currentIndex]);
  if (known[id]) { delete known[id]; } else { known[id] = true; }
  saveKnown();

  isAnimating = true;
  isFlipped = false;
  card.classList.remove('flipped');
  card.classList.add('slide-left');
  setTimeout(function() {
    filteredCards.splice(currentIndex, 1);
    if (currentIndex > filteredCards.length - 1) {
      currentIndex = Math.max(0, filteredCards.length - 1);
    }
    if (isKnownView() && knownCount() === 0) {
      activeTopic = "Wszystkie";
      buildTopicBar();
      updateStats();
      applyFilters();
    } else {
      buildTopicBar();
      updateStats();
      renderCard();
    }
  }, 140);
  setTimeout(function() { card.classList.remove('slide-left'); isAnimating = false; }, 350);
}

function restoreAll() {
  known = {};
  saveKnown();
  if (isKnownView()) activeTopic = "Wszystkie";
  buildTopicBar();
  updateStats();
  applyFilters();
}

function renderCard() {
  markBtn.innerHTML = isKnownView() ? '&#8617; Przywróć' : '&#10003; Umiem';

  if (filteredCards.length === 0) {
    var msg = isKnownView()
      ? 'Nie ma jeszcze odłożonych fiszek'
      : (knownCount() > 0
          ? (activeTopic === "Wszystkie"
              ? 'Wszystko opanowane! Aby wrócić do nauki, użyj „Przywróć wszystkie” nad kartą.'
              : 'Cały dział opanowany! Wybierz inny dział albo użyj „Przywróć wszystkie” nad kartą.')
          : 'Brak fiszek dla tego filtra');
    cardFront.className = 'card-face card-front';
    cardFront.innerHTML = '<div class="card-question">' + msg + '</div>';
    cardBack.innerHTML = '';
    progressFill.style.width = '0%';
    progressLabel.textContent = '0 / 0';
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    markBtn.disabled = true;
    return;
  }
  markBtn.disabled = false;
  var fc = filteredCards[currentIndex];

  cardFront.className = 'card-face card-front';

  cardFront.innerHTML =
    '<div class="card-header"><div class="card-topic">' + fc.topic + '</div></div>' +
    '<div class="card-question">' + fc.q + '</div>' +
    '<div class="tap-hint">dotknij, aby odkryć odpowiedź</div>';

  var answersHTML = '';
  for (var i = 0; i < fc.a.length; i++) {
    answersHTML += '<li>' + fc.a[i] + '</li>';
  }

  cardBack.innerHTML =
    '<div class="card-topic">' + fc.topic + '</div>' +
    '<div class="answer-label">Odpowiedź</div>' +
    '<ul class="answer-list">' + answersHTML + '</ul>' +
    '<div class="tap-hint">dotknij, aby wrócić do pytania</div>';

  var progress = ((currentIndex + 1) / filteredCards.length) * 100;
  progressFill.style.width = progress + '%';
  progressLabel.textContent = (currentIndex + 1) + ' / ' + filteredCards.length;

  prevBtn.disabled = currentIndex === 0;
  nextBtn.disabled = currentIndex === filteredCards.length - 1;
}

function flipCard() {
  if (isAnimating) return;
  isFlipped = !isFlipped;
  card.classList.toggle('flipped', isFlipped);
}

function navigateTo(newIndex, direction) {
  if (isAnimating || newIndex < 0 || newIndex >= filteredCards.length) return;
  isAnimating = true;
  isFlipped = false;
  card.classList.remove('flipped');
  var animClass = direction === 'left' ? 'slide-left' : 'slide-right';
  card.classList.add(animClass);
  setTimeout(function() { currentIndex = newIndex; renderCard(); }, 140);
  setTimeout(function() { card.classList.remove(animClass); isAnimating = false; }, 350);
}

function prevCard() { navigateTo(currentIndex - 1, 'right'); }
function nextCard() { navigateTo(currentIndex + 1, 'left'); }

function shuffleDeck() {
  if (isAnimating) return;
  for (var i = filteredCards.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = filteredCards[i];
    filteredCards[i] = filteredCards[j];
    filteredCards[j] = tmp;
  }
  isFlipped = false;
  card.classList.remove('flipped');
  navigateTo(0, 'left');
}

card.addEventListener('click', flipCard);

var touchStartX = 0;
var cardContainer = document.querySelector('.card-container');
cardContainer.addEventListener('touchstart', function(e) {
  touchStartX = e.changedTouches[0].screenX;
}, { passive: true });
cardContainer.addEventListener('touchend', function(e) {
  var diff = touchStartX - e.changedTouches[0].screenX;
  if (Math.abs(diff) > 60) { if (diff > 0) nextCard(); else prevCard(); }
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft') prevCard();
  else if (e.key === 'ArrowRight') nextCard();
  else if (e.key === ' ') { e.preventDefault(); flipCard(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); toggleKnown(); }
});

buildTopicBar();
updateStats();
applyFilters();
</script>
</body>
</html>
