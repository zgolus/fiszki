<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pan Tadeusz — Księga X</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1712;
    --card-front: #f4efe0;
    --card-back: #16241a;
    --accent: #a8791f;
    --accent-light: #ecd49c;
    --text-dark: #1c2a1e;
    --text-light: #f4efe0;
    --text-muted: #93a08e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text-light);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    user-select: none;
  }

  .header {
    width: 100%;
    max-width: 480px;
    padding: 28px 24px 8px;
    text-align: center;
  }
  .header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.45rem;
    color: var(--accent-light);
    letter-spacing: 0.02em;
  }
  .header .subtitle {
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-top: 6px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  .filters {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 14px 20px 6px;
  }
  .topic-bar {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .topic-bar::-webkit-scrollbar { display: none; }
  .topic-pill {
    flex-shrink: 0;
    padding: 6px 13px;
    border-radius: 20px;
    border: 1px solid #2c3d2f;
    background: transparent;
    color: var(--text-muted);
    font-size: 0.72rem;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s;
    white-space: nowrap;
  }
  .topic-pill.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #16241a;
  }

  .progress-area {
    width: 100%;
    max-width: 480px;
    padding: 10px 24px 4px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .progress-track {
    flex: 1;
    height: 3px;
    background: #2c3d2f;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.4s ease;
  }
  .progress-label {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-weight: 500;
    min-width: 48px;
    text-align: right;
  }

  .card-container {
    width: 100%;
    max-width: 480px;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px 24px;
    perspective: 1000px;
  }

  .card {
    width: 100%;
    aspect-ratio: 3 / 4;
    max-height: 420px;
    position: relative;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .card.flipped { transform: rotateY(180deg); }
  .card.slide-left { animation: slideLeft 0.35s ease both; }
  .card.slide-right { animation: slideRight 0.35s ease both; }
  @keyframes slideLeft {
    0% { opacity: 1; transform: translateX(0); }
    40% { opacity: 0; transform: translateX(-60px); }
    60% { opacity: 0; transform: translateX(60px); }
    100% { opacity: 1; transform: translateX(0); }
  }
  @keyframes slideRight {
    0% { opacity: 1; transform: translateX(0); }
    40% { opacity: 0; transform: translateX(60px); }
    60% { opacity: 0; transform: translateX(-60px); }
    100% { opacity: 1; transform: translateX(0); }
  }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    padding: 26px 22px;
    overflow-y: auto;
  }

  .card-front {
    background: var(--card-front);
    color: var(--text-dark);
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
  }
  .card-front .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: auto;
  }
  .card-front .card-topic {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--accent);
    font-weight: 600;
  }
  .card-front .card-question {
    font-family: 'DM Serif Display', serif;
    font-size: 1.1rem;
    line-height: 1.5;
    text-align: center;
    padding: 0 2px;
  }
  .card-front .tap-hint {
    font-size: 0.7rem;
    color: #8b917f;
    text-align: center;
    margin-top: auto;
    padding-top: 14px;
  }
  .card-back {
    background: var(--card-back);
    color: var(--text-light);
    transform: rotateY(180deg);
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  }
  .card-back .card-topic {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .card-back .answer-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-bottom: 14px;
    font-weight: 600;
  }
  .card-back .answer-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 11px;
    flex: 1;
    justify-content: center;
  }
  .card-back .answer-list li {
    position: relative;
    padding-left: 18px;
    font-size: 0.86rem;
    line-height: 1.5;
    color: var(--accent-light);
  }
  .card-back .answer-list li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 8px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
  }
  .card-back .tap-hint {
    font-size: 0.7rem;
    color: var(--text-muted);
    text-align: center;
    margin-top: auto;
    padding-top: 12px;
  }

  .topic-pill.known-pill {
    border-style: dashed;
    border-color: var(--accent);
    color: var(--accent-light);
  }
  .topic-pill.known-pill.active {
    background: var(--accent);
    border-style: solid;
    color: #16241a;
  }

  .stats-row {
    width: 100%;
    max-width: 480px;
    padding: 4px 24px 0;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
    font-size: 0.72rem;
    color: var(--text-muted);
    min-height: 16px;
  }
  .link-btn {
    background: none;
    border: none;
    padding: 0;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.72rem;
    color: var(--accent-light);
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }

  .nav-area {
    width: 100%;
    max-width: 480px;
    padding: 6px 24px 34px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }
  .nav-btn {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: 1.5px solid #2c3d2f;
    background: transparent;
    color: var(--text-muted);
    font-size: 1.3rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .nav-btn:active {
    background: var(--accent);
    border-color: var(--accent);
    color: #16241a;
    transform: scale(0.92);
  }
  .nav-btn:disabled { opacity: 0.2; pointer-events: none; }
  .shuffle-btn {
    padding: 11px 22px;
    border-radius: 28px;
    border: 1.5px solid #2c3d2f;
    background: transparent;
    color: var(--text-muted);
    font-size: 0.78rem;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.08em;
    transition: all 0.2s;
  }
  .shuffle-btn:active {
    background: var(--accent);
    border-color: var(--accent);
    color: #16241a;
  }
  .mark-btn {
    padding: 11px 18px;
    border-radius: 28px;
    border: 1.5px solid var(--accent);
    background: transparent;
    color: var(--accent-light);
    font-size: 0.78rem;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.06em;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .mark-btn:active {
    background: var(--accent);
    color: #16241a;
    transform: scale(0.95);
  }
  .mark-btn:disabled { opacity: 0.25; pointer-events: none; }

  @media (max-width: 400px) {
    .nav-area { gap: 8px; padding: 6px 14px 30px; }
    .nav-btn { width: 46px; height: 46px; font-size: 1.15rem; }
    .shuffle-btn, .mark-btn { padding: 10px 12px; font-size: 0.7rem; letter-spacing: 0.03em; }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .header { animation: fadeUp 0.5s ease both; }
  .filters { animation: fadeUp 0.5s 0.05s ease both; }
  .progress-area { animation: fadeUp 0.5s 0.1s ease both; }
  .card-container { animation: fadeUp 0.5s 0.2s ease both; }
  .stats-row { animation: fadeUp 0.5s 0.15s ease both; }
  .nav-area { animation: fadeUp 0.5s 0.3s ease both; }
</style>
</head>
<body>

<div class="header">
  <h1>Pan Tadeusz &middot; Księga dziesiąta</h1>
  <div class="subtitle">Emigracja. Jacek &middot; 54 pytania</div>
</div>

<div class="filters">
  <div class="topic-bar" id="topicBar"></div>
</div>

<div class="progress-area">
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel"></div>
</div>

<div class="stats-row" id="statsRow"></div>

<div class="card-container">
  <div class="card" id="card">
    <div class="card-face card-front" id="cardFront"></div>
    <div class="card-face card-back" id="cardBack"></div>
  </div>
</div>

<div class="nav-area">
  <button class="nav-btn" id="prevBtn" onclick="prevCard()">&#8592;</button>
  <button class="mark-btn" id="markBtn" onclick="toggleKnown()">&#10003; Umiem</button>
  <button class="shuffle-btn" onclick="shuffleDeck()">Losuj</button>
  <button class="nav-btn" id="nextBtn" onclick="nextCard()">&#8594;</button>
</div>

<script>
var ALL_FLASHCARDS = [
  // =============================================
  // 1. BURZA I NARADA
  // =============================================

  { topic: "Burza i narada", q: "Jakie zjawisko pogodowe nastąpiło bezpośrednio po walce szlachty z Moskalami?", a: ["Gwałtowna burza z piorunami i ulewą", "Zerwał się wicher, a niebo pociemniało jak w nocy"] },
  { topic: "Burza i narada", q: "W jaki sposób nawałnica „pomogła” szlachcie po starciu z wojskiem ruskim?", a: ["Ciemność zakryła pole bitwy, więc nikt z zewnątrz nic nie zobaczył", "Zalane drogi i zerwane mosty odcięły dwór od świata", "Wiadomość o bitwie nie dotarła do okolicy, a od tego zależał los szlachty"] },
  { topic: "Burza i narada", q: "Z kim przez godzinę naradzał się leżący w łóżku, ranny ks. Robak?", a: ["Z Sędzią, Podkomorzym, Gerwazym i kapitanem Rykowem", "Rozmawiali godzinę przy zamkniętych drzwiach"] },

  // =============================================
  // 2. UKŁADY Z RYKOWEM
  // =============================================

  { topic: "Układy z Rykowem", q: "Za jakiego człowieka szlachta uważa kapitana Rykowa? Nazwij przypisywaną mu cechę charakteru.", a: ["Za człowieka porządnego i uczciwego", "Przypisywana cecha: uczciwość — dotrzymuje danego słowa", "Jest przeciwieństwem podłego Płuta"] },
  { topic: "Układy z Rykowem", q: "Dlaczego szlachta polska chce wręczyć Rykowowi pieniądze?", a: ["Jako odszkodowanie za wybity oddział", "Wiedzą, że kapitan jest biedny", "Chcą też zjednać kapitana, który obiecał załatwić sprawę z władzami"] },
  { topic: "Układy z Rykowem", q: "Czy kapitan Ryków oskarża Polaków o wybicie jego roty?", a: ["Nie — uważa przegraną za zwykłą kolej wojny", "Dziś wygrywają jedni, jutro drudzy, więc nie ma o co się gniewać", "Winą obarcza Płuta"] },
  { topic: "Układy z Rykowem", q: "Czy kapitan Ryków bierze pieniądze oferowane mu przez szlachtę? Jak to uzasadnia?", a: ["Nie bierze — oddaje sakiewkę z powrotem", "Mówi, że żołnierska pensja wystarcza mu na skromne życie", "Za wybity oddział odpowie Płut, a nie szlachta"] },
  { topic: "Układy z Rykowem", q: "Czym jest żołd?", a: ["Stała pensja żołnierza za służbę wojskową", "Ryków mówi, że jego żołd jest niewielki, ale mu wystarcza"] },
  { topic: "Układy z Rykowem", q: "Komu Ryków przypisuje winę za rozpoczęcie walki?", a: ["Majorowi Płutowi", "To on dowodził i kazał strzelać, więc to on odpowie przed carem"] },
  { topic: "Układy z Rykowem", q: "Co Ryków obiecuje Polakom?", a: ["Że weźmie szlachtę w obronę, kiedy zacznie się śledztwo", "Zezna, że żołnierze przyszli z wizytą i pili, a Płut niepotrzebnie kazał strzelać"] },
  { topic: "Układy z Rykowem", q: "Co Ryków radzi Polakom, aby śledztwo w sprawie wybicia moskiewskiej roty zakończyło się dla nich pomyślnie?", a: ["Przekupić urzędników prowadzących śledztwo", "Przekupić także Płuta, żeby milczał"] },

  // =============================================
  // 3. ZNIKNIĘCIE PŁUTA
  // =============================================

  { topic: "Zniknięcie Płuta", q: "Co się stało z Płutem?", a: ["Gerwazy zabił go potajemnie", "Ciała nigdy nie znaleziono, mimo nagrody wyznaczonej za jego odnalezienie", "Klucznik nie chciał niczego wyjaśnić"] },
  { topic: "Zniknięcie Płuta", q: "Co oznaczają słowa „Pro publico bono”?", a: ["Po łacinie: dla dobra ogółu, dla dobra publicznego", "Robak uznaje to za jedyne usprawiedliwienie zabójstwa", "Gerwazy powtarza te słowa zamiast wyjaśnień"] },
  { topic: "Zniknięcie Płuta", q: "Kto znał tajemnicę Klucznika dotyczącą zniknięcia Płuta, lecz honorowo dotrzymując słowa, milczał?", a: ["Wojski Hreczecha", "Dał słowo honoru i nikomu nic nie powiedział"] },

  // =============================================
  // 4. EMIGRACJA
  // =============================================

  { topic: "Emigracja", q: "Podaj dwa powody, które według Podkomorzego doprowadziły do zbyt wczesnego rozpoczęcia walki z Moskalami.", a: ["Ksiądz Robak za bardzo rozgłaszał wieści o szykowanym powstaniu", "Szlachta i Gerwazy źle je zrozumieli i ruszyli do walki przedwcześnie"] },
  { topic: "Emigracja", q: "Dokąd musieli się udać szlachcice najczynniej zaangażowani w bitwę z Moskalami?", a: ["Za Niemen, do Księstwa Warszawskiego, gdzie czekało polskie wojsko", "Uciekać musieli m.in. Maciej Chrzciciel, Tadeusz, Konew i Brzytew", "Całą winę miano zrzucić na nieobecnych i na Płuta"] },

  // =============================================
  // 5. POŻEGNANIA
  // =============================================

  { topic: "Pożegnania", q: "Jaki plan w obliczu przyspieszonego wyjazdu Tadeusza ma wobec niego Sędzia?", a: ["Chce, żeby Tadeusz przed wyjazdem zaręczył się z Zosią", "Telimena już się nie sprzeciwia, a Zosia się zgadza", "Sędzia wierzy, że obrączka uchroni młodego przed pokusami w podróży"] },
  { topic: "Pożegnania", q: "W kim w młodości zakochał się Sędzia i po kim pozostał wdowcem, mimo że do ślubu nie doszło?", a: ["W Marcie, córce Wojskiego", "Byli zaręczeni, ale dziewczyna zmarła przed ślubem", "Sędzia nazywa siebie wdowcem, choć nigdy się nie ożenił"] },
  { topic: "Pożegnania", q: "Dlaczego Tadeusz nie chce przyspieszonych zaręczyn z Zosią?", a: ["Nie chce wiązać Zosi obietnicą, skoro na długo wyjeżdża na wojnę", "Uważa, że jeszcze na nią nie zasłużył", "Chce wrócić lepszym człowiekiem i dopiero wtedy poprosić o rękę"] },
  { topic: "Pożegnania", q: "Co ofiaruje Zosia Tadeuszowi na drogę?", a: ["Obrazek ze świętą Genowefą", "Relikwiarzyk z kawałkiem szaty świętego Józefa"] },
  { topic: "Pożegnania", q: "Hrabia wyjaśnia Tadeuszowi, że pojedynkował się z nim, bo uważał go za rywala. Kim w rzeczywistości był zainteresowany?", a: ["Telimeną", "Tadeusz kochał Zosię, więc wcale nie byli rywalami", "To nieporozumienie doprowadziło do ich kłótni i pojedynku"] },
  { topic: "Pożegnania", q: "Dlaczego Hrabia nie chce wykupić się od więzienia, tylko decyduje się uciekać z innymi?", a: ["Nie chce być tylko zakochanym — woli zostać bohaterem", "Marzy o sławie i wielkich czynach", "Sędzia przekonywał go, że jako bogacz łatwo uniknie więzienia"] },
  { topic: "Pożegnania", q: "Czym jest kolor, który ofiaruje Telimena Hrabiemu?", a: ["Barwa ukochanej, którą rycerz nosi na wojnie jako jej znak", "Telimena oderwała wstążkę od sukni i przypięła Hrabiemu do piersi"] },

  // =============================================
  // 6. SPOWIEDŹ JACKA
  // =============================================

  { topic: "Spowiedź Jacka", q: "Czym jest wijatyk, z którym do ks. Robaka przychodzi pleban?", a: ["Komunia święta udzielana umierającemu", "Ostatni sakrament przed śmiercią, na drogę do wieczności"] },
  { topic: "Spowiedź Jacka", q: "Jakie były pierwsze słowa ks. Robaka, gdy umierający pozostał z Klucznikiem i Sędzią?", a: ["Wyznał, że naprawdę nazywa się Jacek Soplica", "Gerwazy zbladł i chwycił za rapier"] },
  { topic: "Spowiedź Jacka", q: "W jakim celu ks. Robak „spowiada się” Gerwazemu?", a: ["Chce uzyskać przebaczenie przed śmiercią", "Chce wytłumaczyć, dlaczego zabił, i oczyścić się z zarzutu zdrady", "Gerwazy to ostatni sługa Horeszków, więc może mu wybaczyć w ich imieniu"] },
  { topic: "Spowiedź Jacka", q: "Jak Jacek Soplica odbierał przychylność Stolnika Horeszki?", a: ["Brał ją za szczerą przyjaźń", "Stolnik publicznie nazywał go swoim najlepszym przyjacielem"] },
  { topic: "Spowiedź Jacka", q: "Jakie były prawdziwe intencje Stolnika Horeszki wobec Jacka Soplicy?", a: ["Traktował go jak narzędzie — Jacek był mu po prostu potrzebny", "Cenił jego poparcie wśród szlachty, jego szablę i głos na sejmie", "Celowo udawał, że nie widzi jego uczucia do Ewy"] },
  { topic: "Spowiedź Jacka", q: "Czym jest rekuza?", a: ["Odmowa oddania ręki panny, odrzucenie oświadczyn", "Jacek bał się, że ludzie uznają jego zemstę za odwet za taką odmowę"] },
  { topic: "Spowiedź Jacka", q: "Jak miała na imię córka Stolnika Horeszki?", a: ["Ewa", "Wyszła za Wojewodę i została matką Zosi"] },
  { topic: "Spowiedź Jacka", q: "Dlaczego Jacek otwarcie nie poprosił Horeszki o rękę jego córki?", a: ["Nie pozwoliła mu duma", "Bał się odmowy i tego, że szlachta wyśmieje jego upokorzenie"] },
  { topic: "Spowiedź Jacka", q: "Czym była czarna polewka? Co oznaczało jej podanie?", a: ["Czarnina, czyli zupa gotowana na krwi kaczki lub gęsi", "Podana kawalerowi oznaczała odmowę ręki panny"] },
  { topic: "Spowiedź Jacka", q: "W jaki sposób Jacek chciał sobie poradzić z rozpaczą z powodu nieszczęśliwej miłości?", a: ["Chciał zebrać oddział, wyjechać z kraju i zacząć wojnę", "Ożenił się z przypadkową, ubogą dziewczyną", "Kiedy to nie pomogło, zaczął pić"] },
  { topic: "Spowiedź Jacka", q: "Po co Jacek pojechał do Stolnika przed opuszczeniem kraju?", a: ["Żeby się z nim pożegnać przed wyjazdem", "Miał nadzieję, że rozstanie wreszcie poruszy Stolnika i ten zgodzi się oddać mu Ewę"] },
  { topic: "Spowiedź Jacka", q: "Jaki temat poruszył Stolnik, kiedy Jacek przyjechał, aby się pożegnać przed wyprawą?", a: ["Zaczął mówić o wydaniu córki za mąż", "Przyjechał do niego swat od syna kasztelana witebskiego i Stolnik pytał Jacka o radę"] },
  { topic: "Spowiedź Jacka", q: "Jak zareagował Jacek, kiedy Stolnik chciał jego rady w sprawie zamążpójścia córki?", a: ["Nie odpowiedział prawie nic", "Wsiadł na konia i uciekł"] },
  { topic: "Spowiedź Jacka", q: "Dlaczego Jacek nie zdecydował się siłą zabrać Ewy od ojca?", a: ["Ewa była delikatna i lękliwa, wypieszczona przez rodziców", "Nie zniosłaby ucieczki i pogoni — uważał, że by ją tym zabił"] },
  { topic: "Spowiedź Jacka", q: "Co zrobił Jacek po odrzuceniu jego konkurów?", a: ["Postanowił się zemścić, ale ukryć prawdziwy powód zemsty", "Ożenił się z inną kobietą, matką Tadeusza, której nie kochał"] },
  { topic: "Spowiedź Jacka", q: "Do czego doprowadziła Jacka jego urażona duma i nałóg?", a: ["Zaczął pić i zaniedbał dom oraz gospodarstwo", "Żona zmarła z żalu, zostawiając małego Tadeusza", "Wszystko skończyło się zabójstwem Stolnika i hańbą zdrajcy"] },

  // =============================================
  // 7. ZABÓJSTWO STOLNIKA
  // =============================================

  { topic: "Zabójstwo Stolnika", q: "Jakiej potwarzy zdecydowanie przeciwstawia się ks. Robak, kiedy opowiada, jak znalazł się pod zamkiem Stolnika w momencie ataku Moskali?", a: ["Zarzutowi, że działał w porozumieniu z Rosjanami", "Pod zamek przyjechał sam, a Rosjanie zaatakowali niezależnie od niego"] },
  { topic: "Zabójstwo Stolnika", q: "O czym pomyślał Jacek, kiedy zobaczył zwycięskiego Stolnika na ganku podczas ataku Moskali?", a: ["Że Stolnikowi znowu wszystko się udaje i wychodzi cało z każdej opresji", "Wydało mu się, że Stolnik go rozpoznał i z niego drwi", "Chwycił karabin zabitego żołnierza i strzelił niemal bez celowania"] },
  { topic: "Zabójstwo Stolnika", q: "Czy Jacek Soplica próbował uniknąć strzału Gerwazego, gdy ten mierzył do niego z broni?", a: ["Nie — stał nieruchomo i patrzył prosto w lufę", "Do dziś żałuje, że Gerwazy wtedy nie trafił"] },
  { topic: "Zabójstwo Stolnika", q: "Dlaczego Gerwazy nie zabił Jacka?", a: ["Po prostu chybił, choć naprawdę chciał trafić", "Jacek uznał to za wyrok Boga: miał żyć i odpokutować winę"] },
  { topic: "Zabójstwo Stolnika", q: "Dlaczego Gerwazy odstępuje od zemsty na Jacku – ks. Robaku?", a: ["Jacek jest zakonnikiem, a na duchownego Gerwazy ręki nie podniesie", "Podczas bitwy Jacek uratował życie Hrabiemu i jemu samemu", "Uważa też, że grzechem jest dręczyć umierającego"] },
  { topic: "Zabójstwo Stolnika", q: "Dlaczego Klucznik nie chce podać ręki i wybaczyć zemsty Jacka na Stolniku?", a: ["Uważa, że szlachcicowi nie wolno podać ręki skrytobójcy", "Zabójstwo było prywatną zemstą, a nie czynem dla dobra ogółu"] },
  { topic: "Zabójstwo Stolnika", q: "Co najbardziej doskwierało Jackowi po zabiciu Stolnika?", a: ["Opinia zdrajcy, która przylgnęła do niego na zawsze", "Sąsiedzi i dawni przyjaciele odwrócili się od niego", "A zdrajcą nie był — odmówił przyjęcia urzędu od targowiczan, stronników Rosji"] },

  // =============================================
  // 8. POKUTA I ŚMIERĆ
  // =============================================

  { topic: "Pokuta i śmierć", q: "Co stało się z Ewą?", a: ["Wydano ją za Wojewodę", "Zesłano ich na Syberię, gdzie zmarła młodo", "Została po niej córka — Zosia, którą Jacek kazał wychować"] },
  { topic: "Pokuta i śmierć", q: "Dlaczego Jacek wstąpił do zakonu i przybrał imię Robaka?", a: ["Zabił z pychy, więc za karę wybrał życie w pokorze", "Imię Robak miało przypominać, że czuje się najmarniejszym ze stworzeń"] },
  { topic: "Pokuta i śmierć", q: "W jaki sposób chciał zadośćuczynić za „zły przykład dla ojczyzny, zachętę do zdrady”?", a: ["Chciał odkupić winę dobrymi czynami, krwią i poświęceniem", "Jako tajny wysłannik przewoził rozkazy i przygotowywał powstanie", "Pracował przy taczkach w pruskiej twierdzy, Rosjanie bili go kijami, Austriacy więzili w Szpilbergu"] },
  { topic: "Pokuta i śmierć", q: "Dlaczego zbyt skwapliwie zaczął działać na rzecz powstania? — „Możem nad rozkaz wodzów powstanie przyśpieszył!”", a: ["Znowu odezwała się w nim duma rodowa", "Chciał, żeby to Soplicowie pierwsi chwycili za broń i zmyli hańbę nazwiska", "Umierając, sam nie jest pewien, czy znów nie zgrzeszył pychą"] },
  { topic: "Pokuta i śmierć", q: "Kto udaremnił / skomplikował plany powstańcze ks. Robaka?", a: ["Gerwazy", "Podburzył szlachtę do najazdu na Soplicowo i zniszczył lata przygotowań", "Mimo to Jacek mu przebaczył"] },
  { topic: "Pokuta i śmierć", q: "Jaką tajemnicę umierającemu Jackowi wyjawił Gerwazy?", a: ["Że Stolnik przed śmiercią przebaczył swojemu zabójcy", "Umierając, przeżegnał go ręką w stronę, gdzie stał Jacek"] },
  { topic: "Pokuta i śmierć", q: "Jaka informacja znalazła się w liście od Fiszera?", a: ["Zapadła decyzja o wojnie Napoleona z Rosją", "W Warszawie zbierze się sejm, który ogłosi przyłączenie Litwy"] },
  { topic: "Pokuta i śmierć", q: "O jakiej porze umiera ks. Robak?", a: ["O świcie, tuż po wschodzie słońca", "Pierwsze promienie słońca oświetliły jego twarz"] },
];

// --- Engine ---
var TOPICS = ["Wszystkie"];
var seen = {};
for (var i = 0; i < ALL_FLASHCARDS.length; i++) {
  var t = ALL_FLASHCARDS[i].topic;
  if (!seen[t]) { seen[t] = true; TOPICS.push(t); }
}

var DECK_ID = 'pan_tadeusz_ksiega_x';
var STORE_KEY = 'fiszki:' + DECK_ID + ':opanowane';
var KNOWN_VIEW = "__odlozone__";

var activeTopic = "Wszystkie";
var known = loadKnown();
var filteredCards = [];
var currentIndex = 0;
var isFlipped = false;
var isAnimating = false;

var card = document.getElementById('card');
var cardFront = document.getElementById('cardFront');
var cardBack = document.getElementById('cardBack');
var progressFill = document.getElementById('progressFill');
var progressLabel = document.getElementById('progressLabel');
var prevBtn = document.getElementById('prevBtn');
var nextBtn = document.getElementById('nextBtn');
var topicBar = document.getElementById('topicBar');
var markBtn = document.getElementById('markBtn');
var statsRow = document.getElementById('statsRow');

function applyFilters() {
  var cards = [];
  for (var i = 0; i < ALL_FLASHCARDS.length; i++) {
    var f = ALL_FLASHCARDS[i];
    var isKnown = !!known[cardId(f)];
    if (isKnownView()) {
      if (!isKnown) continue;
    } else {
      if (isKnown) continue;
      if (activeTopic !== "Wszystkie" && f.topic !== activeTopic) continue;
    }
    cards.push(f);
  }
  filteredCards = cards;
  currentIndex = 0;
  isFlipped = false;
  card.classList.remove('flipped');
  renderCard();
}

function buildTopicBar() {
  topicBar.innerHTML = '';
  for (var i = 0; i < TOPICS.length; i++) {
    var t = TOPICS[i];
    var pill = document.createElement('button');
    pill.className = 'topic-pill' + (t === activeTopic ? ' active' : '');
    pill.textContent = t;
    pill.setAttribute('data-topic', t);
    pill.onclick = function() {
      activeTopic = this.getAttribute('data-topic');
      buildTopicBar();
      applyFilters();
    };
    topicBar.appendChild(pill);
    if (i === 0) appendKnownPill();
  }
}

function appendKnownPill() {
  var kn = knownCount();
  if (kn === 0) return;
  var knownPill = document.createElement('button');
  knownPill.className = 'topic-pill known-pill' + (isKnownView() ? ' active' : '');
  knownPill.innerHTML = '&#10003; Odłożone (' + kn + ')';
  knownPill.setAttribute('data-topic', KNOWN_VIEW);
  knownPill.onclick = function() {
    activeTopic = this.getAttribute('data-topic');
    buildTopicBar();
    applyFilters();
  };
  topicBar.appendChild(knownPill);
}

// --- odkładanie opanowanych fiszek ---
function cardId(f) { return f.q; }
function isKnownView() { return activeTopic === KNOWN_VIEW; }

function loadKnown() {
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (!raw) return {};
    var arr = JSON.parse(raw);
    var map = {};
    for (var i = 0; i < arr.length; i++) map[arr[i]] = true;
    return map;
  } catch (e) { return {}; }
}

function saveKnown() {
  try {
    var arr = [];
    for (var k in known) { if (known[k]) arr.push(k); }
    localStorage.setItem(STORE_KEY, JSON.stringify(arr));
  } catch (e) {}
}

function knownCount() {
  var n = 0;
  for (var i = 0; i < ALL_FLASHCARDS.length; i++) {
    if (known[cardId(ALL_FLASHCARDS[i])]) n++;
  }
  return n;
}

function plural(n, one, few, many) {
  var n10 = n % 10, n100 = n % 100;
  if (n === 1) return one;
  if (n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14)) return few;
  return many;
}

function updateStats() {
  var n = knownCount();
  if (n === 0) { statsRow.innerHTML = ''; return; }
  statsRow.innerHTML =
    '<span>' + n + ' ' + plural(n, 'fiszka odłożona', 'fiszki odłożone', 'fiszek odłożonych') + '</span>' +
    '<button class="link-btn" onclick="restoreAll()">Przywróć wszystkie</button>';
}

function toggleKnown() {
  if (isAnimating || filteredCards.length === 0) return;
  var id = cardId(filteredCards[currentIndex]);
  if (known[id]) { delete known[id]; } else { known[id] = true; }
  saveKnown();

  isAnimating = true;
  isFlipped = false;
  card.classList.remove('flipped');
  card.classList.add('slide-left');
  setTimeout(function() {
    filteredCards.splice(currentIndex, 1);
    if (currentIndex > filteredCards.length - 1) {
      currentIndex = Math.max(0, filteredCards.length - 1);
    }
    if (isKnownView() && knownCount() === 0) {
      activeTopic = "Wszystkie";
      buildTopicBar();
      updateStats();
      applyFilters();
    } else {
      buildTopicBar();
      updateStats();
      renderCard();
    }
  }, 140);
  setTimeout(function() { card.classList.remove('slide-left'); isAnimating = false; }, 350);
}

function restoreAll() {
  known = {};
  saveKnown();
  if (isKnownView()) activeTopic = "Wszystkie";
  buildTopicBar();
  updateStats();
  applyFilters();
}

function renderCard() {
  markBtn.innerHTML = isKnownView() ? '&#8617; Przywróć' : '&#10003; Umiem';

  if (filteredCards.length === 0) {
    var msg = isKnownView()
      ? 'Nie ma jeszcze odłożonych fiszek'
      : (knownCount() > 0
          ? (activeTopic === "Wszystkie"
              ? 'Wszystko opanowane! Aby wrócić do nauki, użyj „Przywróć wszystkie” nad kartą.'
              : 'Cały dział opanowany! Wybierz inny dział albo użyj „Przywróć wszystkie” nad kartą.')
          : 'Brak fiszek dla tego filtra');
    cardFront.className = 'card-face card-front';
    cardFront.innerHTML = '<div class="card-question">' + msg + '</div>';
    cardBack.innerHTML = '';
    progressFill.style.width = '0%';
    progressLabel.textContent = '0 / 0';
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    markBtn.disabled = true;
    return;
  }
  markBtn.disabled = false;
  var fc = filteredCards[currentIndex];

  cardFront.className = 'card-face card-front';

  cardFront.innerHTML =
    '<div class="card-header"><div class="card-topic">' + fc.topic + '</div></div>' +
    '<div class="card-question">' + fc.q + '</div>' +
    '<div class="tap-hint">dotknij, aby odkryć odpowiedź</div>';

  var answersHTML = '';
  for (var i = 0; i < fc.a.length; i++) {
    answersHTML += '<li>' + fc.a[i] + '</li>';
  }

  cardBack.innerHTML =
    '<div class="card-topic">' + fc.topic + '</div>' +
    '<div class="answer-label">Odpowiedź</div>' +
    '<ul class="answer-list">' + answersHTML + '</ul>' +
    '<div class="tap-hint">dotknij, aby wrócić do pytania</div>';

  var progress = ((currentIndex + 1) / filteredCards.length) * 100;
  progressFill.style.width = progress + '%';
  progressLabel.textContent = (currentIndex + 1) + ' / ' + filteredCards.length;

  prevBtn.disabled = currentIndex === 0;
  nextBtn.disabled = currentIndex === filteredCards.length - 1;
}

function flipCard() {
  if (isAnimating) return;
  isFlipped = !isFlipped;
  card.classList.toggle('flipped', isFlipped);
}

function navigateTo(newIndex, direction) {
  if (isAnimating || newIndex < 0 || newIndex >= filteredCards.length) return;
  isAnimating = true;
  isFlipped = false;
  card.classList.remove('flipped');
  var animClass = direction === 'left' ? 'slide-left' : 'slide-right';
  card.classList.add(animClass);
  setTimeout(function() { currentIndex = newIndex; renderCard(); }, 140);
  setTimeout(function() { card.classList.remove(animClass); isAnimating = false; }, 350);
}

function prevCard() { navigateTo(currentIndex - 1, 'right'); }
function nextCard() { navigateTo(currentIndex + 1, 'left'); }

function shuffleDeck() {
  if (isAnimating) return;
  for (var i = filteredCards.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = filteredCards[i];
    filteredCards[i] = filteredCards[j];
    filteredCards[j] = tmp;
  }
  isFlipped = false;
  card.classList.remove('flipped');
  navigateTo(0, 'left');
}

card.addEventListener('click', flipCard);

var touchStartX = 0;
var cardContainer = document.querySelector('.card-container');
cardContainer.addEventListener('touchstart', function(e) {
  touchStartX = e.changedTouches[0].screenX;
}, { passive: true });
cardContainer.addEventListener('touchend', function(e) {
  var diff = touchStartX - e.changedTouches[0].screenX;
  if (Math.abs(diff) > 60) { if (diff > 0) nextCard(); else prevCard(); }
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft') prevCard();
  else if (e.key === 'ArrowRight') nextCard();
  else if (e.key === ' ') { e.preventDefault(); flipCard(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); toggleKnown(); }
});

buildTopicBar();
updateStats();
applyFilters();
</script>
</body>
</html>
