<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pan Tadeusz — Księga X</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1712;
    --card-front: #f4efe0;
    --card-back: #16241a;
    --accent: #a8791f;
    --accent-light: #ecd49c;
    --text-dark: #1c2a1e;
    --text-light: #f4efe0;
    --text-muted: #93a08e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text-light);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    user-select: none;
  }

  .header {
    width: 100%;
    max-width: 480px;
    padding: 28px 24px 8px;
    text-align: center;
  }
  .header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.45rem;
    color: var(--accent-light);
    letter-spacing: 0.02em;
  }
  .header .subtitle {
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-top: 6px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  .filters {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 14px 20px 6px;
  }
  .topic-bar {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .topic-bar::-webkit-scrollbar { display: none; }
  .topic-pill {
    flex-shrink: 0;
    padding: 6px 13px;
    border-radius: 20px;
    border: 1px solid #2c3d2f;
    background: transparent;
    color: var(--text-muted);
    font-size: 0.72rem;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s;
    white-space: nowrap;
  }
  .topic-pill.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #16241a;
  }

  .priority-row {
    display: flex;
    gap: 8px;
  }
  .priority-pill {
    flex-shrink: 0;
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid #2c3d2f;
    background: transparent;
    color: var(--text-muted);
    font-size: 0.68rem;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .priority-pill.active {
    border-color: var(--accent);
    color: var(--accent-light);
  }
  .priority-pill .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    display: inline-block;
  }
  .priority-pill .dot.critical { background: #a8791f; }
  .priority-pill .dot.extra { background: #7f9a6b; }

  .progress-area {
    width: 100%;
    max-width: 480px;
    padding: 10px 24px 4px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .progress-track {
    flex: 1;
    height: 3px;
    background: #2c3d2f;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.4s ease;
  }
  .progress-label {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-weight: 500;
    min-width: 48px;
    text-align: right;
  }

  .card-container {
    width: 100%;
    max-width: 480px;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px 24px;
    perspective: 1000px;
  }

  .card {
    width: 100%;
    aspect-ratio: 3 / 4;
    max-height: 420px;
    position: relative;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .card.flipped { transform: rotateY(180deg); }
  .card.slide-left { animation: slideLeft 0.35s ease both; }
  .card.slide-right { animation: slideRight 0.35s ease both; }
  @keyframes slideLeft {
    0% { opacity: 1; transform: translateX(0); }
    40% { opacity: 0; transform: translateX(-60px); }
    60% { opacity: 0; transform: translateX(60px); }
    100% { opacity: 1; transform: translateX(0); }
  }
  @keyframes slideRight {
    0% { opacity: 1; transform: translateX(0); }
    40% { opacity: 0; transform: translateX(60px); }
    60% { opacity: 0; transform: translateX(-60px); }
    100% { opacity: 1; transform: translateX(0); }
  }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    padding: 26px 22px;
    overflow-y: auto;
  }

  .card-front {
    background: var(--card-front);
    color: var(--text-dark);
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
  }
  .card-front .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: auto;
  }
  .card-front .card-topic {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--accent);
    font-weight: 600;
  }
  .card-front .card-badge {
    font-size: 0.58rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 10px;
  }
  .card-front .card-badge.critical {
    background: #a8791f;
    color: #16241a;
  }
  .card-front .card-badge.extra {
    background: transparent;
    border: 1px solid #a9ae9c;
    color: #6f7a63;
  }
  .card-front .card-question {
    font-family: 'DM Serif Display', serif;
    font-size: 1.1rem;
    line-height: 1.5;
    text-align: center;
    padding: 0 2px;
  }
  .card-front .tap-hint {
    font-size: 0.7rem;
    color: #8b917f;
    text-align: center;
    margin-top: auto;
    padding-top: 14px;
  }
  .card-front.is-critical {
    border-top: 3px solid #a8791f;
  }

  .card-back {
    background: var(--card-back);
    color: var(--text-light);
    transform: rotateY(180deg);
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  }
  .card-back .card-topic {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .card-back .answer-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-bottom: 14px;
    font-weight: 600;
  }
  .card-back .answer-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 11px;
    flex: 1;
    justify-content: center;
  }
  .card-back .answer-list li {
    position: relative;
    padding-left: 18px;
    font-size: 0.86rem;
    line-height: 1.5;
    color: var(--accent-light);
  }
  .card-back .answer-list li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 8px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
  }
  .card-back .tap-hint {
    font-size: 0.7rem;
    color: var(--text-muted);
    text-align: center;
    margin-top: auto;
    padding-top: 12px;
  }

  .nav-area {
    width: 100%;
    max-width: 480px;
    padding: 6px 24px 34px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }
  .nav-btn {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: 1.5px solid #2c3d2f;
    background: transparent;
    color: var(--text-muted);
    font-size: 1.3rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .nav-btn:active {
    background: var(--accent);
    border-color: var(--accent);
    color: #16241a;
    transform: scale(0.92);
  }
  .nav-btn:disabled { opacity: 0.2; pointer-events: none; }
  .shuffle-btn {
    padding: 11px 22px;
    border-radius: 28px;
    border: 1.5px solid #2c3d2f;
    background: transparent;
    color: var(--text-muted);
    font-size: 0.78rem;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.08em;
    transition: all 0.2s;
  }
  .shuffle-btn:active {
    background: var(--accent);
    border-color: var(--accent);
    color: #16241a;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .header { animation: fadeUp 0.5s ease both; }
  .filters { animation: fadeUp 0.5s 0.05s ease both; }
  .progress-area { animation: fadeUp 0.5s 0.1s ease both; }
  .card-container { animation: fadeUp 0.5s 0.2s ease both; }
  .nav-area { animation: fadeUp 0.5s 0.3s ease both; }
</style>
</head>
<body>

<div class="header">
  <h1>Pan Tadeusz &middot; Księga dziesiąta</h1>
  <div class="subtitle">Emigracja. Jacek &middot; 54 pytania</div>
</div>

<div class="filters">
  <div class="topic-bar" id="topicBar"></div>
  <div class="priority-row" id="priorityRow"></div>
</div>

<div class="progress-area">
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel"></div>
</div>

<div class="card-container">
  <div class="card" id="card">
    <div class="card-face card-front" id="cardFront"></div>
    <div class="card-face card-back" id="cardBack"></div>
  </div>
</div>

<div class="nav-area">
  <button class="nav-btn" id="prevBtn" onclick="prevCard()">&#8592;</button>
  <button class="shuffle-btn" onclick="shuffleDeck()">Losuj</button>
  <button class="nav-btn" id="nextBtn" onclick="nextCard()">&#8594;</button>
</div>

<script>
// p: "c" = kluczowe (z podsumowania podręcznika), "e" = dodatkowe
var ALL_FLASHCARDS = [
  // =============================================
  // 1. BURZA I NARADA
  // =============================================

  { topic: "Burza i narada", p: "e", q: "Jakie zjawisko pogodowe nastąpiło bezpośrednio po walce szlachty z Moskalami?", a: ["Gwałtowna burza z piorunami i ulewą — nawałnica zbierająca się od rana", "Wichry rwały trawy i zboża, a jeden wzbił się jak ruchoma piramida i trąbą otrębował burzę", "Pioruny, ulewa „jak z wiader” i ciemność gruba, gęsta, prawie dotykalna", "Noc „z burzą od nocy czarniejszą” zapadła nad placem boju"] },
  { topic: "Burza i narada", p: "c", q: "W jaki sposób nawałnica „pomogła” szlachcie po starciu z wojskiem ruskim?", a: ["Okryła mrokiem plac boju, więc nikt z zewnątrz nie zobaczył, co się stało", "Zalała drogi i zerwała mosty na rzece — folwark Soplicy stał się niedostępną fortecą", "Wieść o bitwie nie mogła rozejść się po okolicy", "A właśnie od zachowania tajemnicy zależał los całej szlachty"] },
  { topic: "Burza i narada", p: "e", q: "Z kim przez godzinę naradzał się leżący w łóżku, ranny ks. Robak?", a: ["Z Sędzią, który ściśle wypełniał wszystkie jego rozkazy", "Z Podkomorzym i z Klucznikiem Gerwazym", "Oraz z przyprowadzonym kapitanem Rykowem", "Drzwi zamknięto — „godzinę całą trwały tajemne rozmowy”"] },

  // =============================================
  // 2. UKŁADY Z RYKOWEM
  // =============================================

  { topic: "Układy z Rykowem", p: "c", q: "Za jakiego człowieka szlachta uważa kapitana Rykowa? Nazwij przypisywaną mu cechę charakteru.", a: ["Za człowieka poczciwego — „Żeś człek poczciwy, wiedzą tu wszyscy ziemianie”", "Przypisywana mu cecha to uczciwość i honor: dotrzymuje danego słowa", "Znali go od lat, bo stawał u ziemian na kwaterach", "Jest pozytywnym przeciwieństwem chciwego i podłego Płuta"] },
  { topic: "Układy z Rykowem", p: "c", q: "Dlaczego szlachta polska chce wręczyć Rykowowi pieniądze?", a: ["Jako zadośćuczynienie — stracił całą rotę, a szlachta nie chciała go skrzywdzić", "Wiedzieli, że jest niebogaty: „te dukaty śmieliśmy złożyć wiedząc, żeś człek niebogaty”", "Liczyli też na jego przychylne świadectwo w przyszłym śledztwie", "Kiesa ciężka dukatami leżała na stole w izbie Sędziego"] },
  { topic: "Układy z Rykowem", p: "c", q: "Czy kapitan Ryków oskarża Polaków o wybicie jego roty?", a: ["Nie — traktuje klęskę jako zwykłą kolej wojennego losu", "Cytuje ruskie przysłowie: kto dziś na wozie, jutro bywa pod wozem; „dziś bijesz, jutro ciebie biją”", "Bez urazy wspomina własne porażki (Racławice, Zurych) i zwycięstwa (Maciejowice)", "Całą winę składa na Płuta, nie na szlachtę"] },
  { topic: "Układy z Rykowem", p: "c", q: "Czy kapitan Ryków bierze pieniądze oferowane mu przez szlachtę? Jak to uzasadnia?", a: ["Nie bierze — rzuca kiesę z dukatami z powrotem na stół", "Ma swój żołd kapitański, a wystarczy mu „na ponczyk i lulkę tabaki”", "Lubi Polaków, bo to ludzie weseli, „dobrzy do wypitki i dobrzy do wybitki”", "Za wybicie roty przed carem odpowie Płut, a nie szlachta"] },
  { topic: "Układy z Rykowem", p: "e", q: "Czym jest żołd?", a: ["Stałe wynagrodzenie pieniężne żołnierza za służbę wojskową", "Wypłacane regularnie przez władcę lub państwo utrzymujące wojsko", "Ryków mówi, że jego żołd kapitański jest „lada jaki”, ale mu na życie starcza"] },
  { topic: "Układy z Rykowem", p: "c", q: "Komu Ryków przypisuje winę za rozpoczęcie walki?", a: ["Majorowi Płutowi — „Moja rota! a wszystko z winy tego Płuta!”", "To Płut był pierwszym komendantem i to on zakomenderował ognia", "„On za to przed carem odpowie” — odpowiedzialność spada na dowódcę"] },
  { topic: "Układy z Rykowem", p: "c", q: "Co Ryków obiecuje Polakom?", a: ["Że ich obroni i da za nimi świadectwo, gdy zacznie się śledztwo — daje na to „słowo uczciwe”", "Zezna, że Moskale przyszli z wizytą, pili, tańczyli i sobie podchmielili", "A Płut przypadkiem kazał dać ognia i tak się „batalijon jakoś zmarnował”"] },
  { topic: "Układy z Rykowem", p: "c", q: "Co Ryków radzi Polakom, aby śledztwo w sprawie wybicia moskiewskiej roty zakończyło się dla nich pomyślnie?", a: ["Żeby „śledztwo pomazywać złotem” — przekupić prowadzących je urzędników, a wtedy „będzie kręcić się”", "Żeby Płutowi „zatkać gębę bankowym papierem”, czyli przekupić go banknotami", "Ostrzega, że Płut został żywy i jako „chytra sztuczka” może im „zagiąć kruczka”"] },

  // =============================================
  // 3. ZNIKNIĘCIE PŁUTA
  // =============================================

  { topic: "Zniknięcie Płuta", p: "c", q: "Co się stało z Płutem?", a: ["Potajemnie zabił go Gerwazy: „Klnę się Scyzorykiem, że Płut nie wyda! gadać już nie będzie z nikim!”", "Nazajutrz daremnie szukano go we dworze i wyznaczono nagrodę za trupa", "„Major zginął bez śladu, jak gdyby wpadł w wodę” — nikt na pewno nie wiedział, co się stało", "Ryków skwitował to przysłowiem: „Nosił wilk, ponieśli i wilka!”"] },
  { topic: "Zniknięcie Płuta", p: "e", q: "Co oznaczają słowa „Pro publico bono”?", a: ["Po łacinie: „dla dobra publicznego”, dla dobra ogółu", "Robak mówi, że to jedyna restrykcyja (okoliczność łagodząca) zabójstwa: jeśli popełniono je nie z głupiej zemsty, ale pro publico bono", "Gerwazy powtarzał te słowa jako jedyne wyjaśnienie zniknięcia Płuta", "Tymi samymi słowami odmówi potem podania ręki Jackowi"] },
  { topic: "Zniknięcie Płuta", p: "e", q: "Kto znał tajemnicę Klucznika dotyczącą zniknięcia Płuta, lecz honorowo dotrzymując słowa, milczał?", a: ["Wojski Hreczecha", "„Wojski był w tajemnicy, lecz słowem ujęty honorowym, staruszek milczał jak zaklęty”"] },

  // =============================================
  // 4. EMIGRACJA
  // =============================================

  { topic: "Emigracja", p: "c", q: "Podaj dwa powody, które według Podkomorzego doprowadziły do zbyt wczesnego rozpoczęcia walki z Moskalami.", a: ["Ksiądz Robak zbyt czynnie rozszerzał nowiny o zbliżającym się powstaniu", "Klucznik i szlachta pojęli te nowiny opacznie — zrozumieli je źle i chwycili za broń przedwcześnie", "„Zbłądziliśmy i nikt tu z nas nie jest bez winy”", "Wojna z Rosją miała się zacząć dopiero za jakiś czas"] },
  { topic: "Emigracja", p: "c", q: "Dokąd musieli się udać szlachcice najczynniej zaangażowani w bitwę z Moskalami?", a: ["Za Niemen, do Księstwa Warszawskiego, gdzie czekał na nich „zastęp narodowy”", "Uciekać musieli m.in. Maciej Chrzciciel, Tadeusz, Konew i Brzytew", "Na nieobecnych i na Płuta zwalono by całą winę, żeby ocalić resztę szlachty", "Kto raz zwadził się z carem, musi „albo bić się, albo gnić w Sybirze”"] },

  // =============================================
  // 5. POŻEGNANIA
  // =============================================

  { topic: "Pożegnania", p: "c", q: "Jaki plan w obliczu przyspieszonego wyjazdu Tadeusza ma wobec niego Sędzia?", a: ["Chce, by Tadeusz przed odjazdem poprosił Zosię o rękę", "Skoro ślub jest niemożliwy, niech przynajmniej odbędą się zaręczyny", "Telimena już nie przeszkadza, a Zosia zgadza się z wolą opiekunów", "Sędzia wierzy, że „wielką siłę ma ślubna obrączka” — ostudzi pokusy w podróży"] },
  { topic: "Pożegnania", p: "e", q: "W kim w młodości zakochał się Sędzia i po kim pozostał wdowcem, mimo że do ślubu nie doszło?", a: ["W pannie Marcie — Wojszczance, córce przyjaciela, Wojskiego Hreczechy", "Byli zaręczeni, ale Bóg nie pobłogosławił związkowi i wziął ją do swojej chwały", "Sędzia dochował jej wiary: „nie bywszy małżonkiem, jestem wdowiec stary”", "Pamiątką został ślubny złoty pierścień, na który patrzy ze łzami"] },
  { topic: "Pożegnania", p: "c", q: "Dlaczego Tadeusz nie chce przyspieszonych zaręczyn z Zosią?", a: ["Nie chce więzić jej woli, skoro wyjeżdża może na bardzo długo", "Uważa, że nie zasłużył na wzajemność — prosić o nią „byłaby nikczemność”", "Chce wrócić lepszy i godniejszy, zdobyć ją stałością i „troszeczką sławy” ozdobić swoje imię", "Dopiero wtedy na klęczkach poprosi o rękę, jeśli Zosia będzie wolna"] },
  { topic: "Pożegnania", p: "e", q: "Co ofiaruje Zosia Tadeuszowi na drogę?", a: ["Obrazek ze świętą Genowefą", "Relikwiarzyk z cząstką sukni świętego Józefa — patrona zaręczonej młodzi", "Wyjęła je z domowego ołtarzyka", "Dodała przestrogę, by zawsze nosił je przy sobie i pamiętał o Zosi"] },
  { topic: "Pożegnania", p: "c", q: "Hrabia wyjaśnia Tadeuszowi, że pojedynkował się z nim, bo uważał go za rywala. Kim w rzeczywistości był zainteresowany?", a: ["Telimeną — „ja zaś tej pięknej nimfie oddałem me serce”", "Tadeusz tymczasem wzdychał do „pasterki”, czyli do Zosi", "Ta pomyłka była jedną z przyczyn ich smutnej zwady i pojedynku", "Hrabia proponuje, by odtąd ścigali się nie szpadą, lecz stałością uczuć i męstwem wobec wroga"] },

// --- Engine ---
var TOPICS = ["Wszystkie"];
var seen = {};
for (var i = 0; i < ALL_FLASHCARDS.length; i++) {
  var t = ALL_FLASHCARDS[i].topic;
  if (!seen[t]) { seen[t] = true; TOPICS.push(t); }
}

var activeTopic = "Wszystkie";
var activeFilter = "all";
var filteredCards = ALL_FLASHCARDS.slice();
var currentIndex = 0;
var isFlipped = false;
var isAnimating = false;

var card = document.getElementById('card');
var cardFront = document.getElementById('cardFront');
var cardBack = document.getElementById('cardBack');
var progressFill = document.getElementById('progressFill');
var progressLabel = document.getElementById('progressLabel');
var prevBtn = document.getElementById('prevBtn');
var nextBtn = document.getElementById('nextBtn');
var topicBar = document.getElementById('topicBar');
var priorityRow = document.getElementById('priorityRow');

function applyFilters() {
  var cards = [];
  for (var i = 0; i < ALL_FLASHCARDS.length; i++) {
    var f = ALL_FLASHCARDS[i];
    if (activeTopic !== "Wszystkie" && f.topic !== activeTopic) continue;
    if (activeFilter === "c" && f.p !== "c") continue;
    if (activeFilter === "e" && f.p !== "e") continue;
    cards.push(f);
  }
  filteredCards = cards;
  currentIndex = 0;
  isFlipped = false;
  card.classList.remove('flipped');
  renderCard();
}

function buildTopicBar() {
  topicBar.innerHTML = '';
  for (var i = 0; i < TOPICS.length; i++) {
    var t = TOPICS[i];
    var pill = document.createElement('button');
    pill.className = 'topic-pill' + (t === activeTopic ? ' active' : '');
    pill.textContent = t;
    pill.setAttribute('data-topic', t);
    pill.onclick = function() {
      activeTopic = this.getAttribute('data-topic');
      buildTopicBar();
      applyFilters();
    };
    topicBar.appendChild(pill);
  }
}

function buildPriorityRow() {
  var opts = [
    { key: "all", label: "Wszystkie", dotClass: "" },
    { key: "c",   label: "Kluczowe",  dotClass: "critical" },
    { key: "e",   label: "Dodatkowe", dotClass: "extra" }
  ];
  priorityRow.innerHTML = '';
  for (var i = 0; i < opts.length; i++) {
    var o = opts[i];
    var pill = document.createElement('button');
    pill.className = 'priority-pill' + (activeFilter === o.key ? ' active' : '');
    pill.innerHTML = (o.dotClass ? '<span class="dot ' + o.dotClass + '"></span>' : '') + o.label;
    pill.setAttribute('data-key', o.key);
    pill.onclick = function() {
      activeFilter = this.getAttribute('data-key');
      buildPriorityRow();
      applyFilters();
    };
    priorityRow.appendChild(pill);
  }
}

function renderCard() {
  if (filteredCards.length === 0) {
    cardFront.innerHTML = '<div class="card-question">Brak fiszek dla tego filtra</div>';
    cardBack.innerHTML = '';
    progressFill.style.width = '0%';
    progressLabel.textContent = '0 / 0';
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    return;
  }
  var fc = filteredCards[currentIndex];
  var isCritical = fc.p === "c";

  cardFront.className = 'card-face card-front' + (isCritical ? ' is-critical' : '');

  var badgeHTML = isCritical
    ? '<span class="card-badge critical">kluczowe</span>'
    : '<span class="card-badge extra">dodatkowe</span>';

  cardFront.innerHTML =
    '<div class="card-header"><div class="card-topic">' + fc.topic + '</div>' + badgeHTML + '</div>' +
    '<div class="card-question">' + fc.q + '</div>' +
    '<div class="tap-hint">dotknij, aby odkryć odpowiedź</div>';

  var answersHTML = '';
  for (var i = 0; i < fc.a.length; i++) {
    answersHTML += '<li>' + fc.a[i] + '</li>';
  }

  cardBack.innerHTML =
    '<div class="card-topic">' + fc.topic + '</div>' +
    '<div class="answer-label">Odpowiedź</div>' +
    '<ul class="answer-list">' + answersHTML + '</ul>' +
    '<div class="tap-hint">dotknij, aby wrócić do pytania</div>';

  var progress = ((currentIndex + 1) / filteredCards.length) * 100;
  progressFill.style.width = progress + '%';
  progressLabel.textContent = (currentIndex + 1) + ' / ' + filteredCards.length;

  prevBtn.disabled = currentIndex === 0;
  nextBtn.disabled = currentIndex === filteredCards.length - 1;
}

function flipCard() {
  if (isAnimating) return;
  isFlipped = !isFlipped;
  card.classList.toggle('flipped', isFlipped);
}

function navigateTo(newIndex, direction) {
  if (isAnimating || newIndex < 0 || newIndex >= filteredCards.length) return;
  isAnimating = true;
  isFlipped = false;
  card.classList.remove('flipped');
  var animClass = direction === 'left' ? 'slide-left' : 'slide-right';
  card.classList.add(animClass);
  setTimeout(function() { currentIndex = newIndex; renderCard(); }, 140);
  setTimeout(function() { card.classList.remove(animClass); isAnimating = false; }, 350);
}

function prevCard() { navigateTo(currentIndex - 1, 'right'); }
function nextCard() { navigateTo(currentIndex + 1, 'left'); }

function shuffleDeck() {
  if (isAnimating) return;
  for (var i = filteredCards.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = filteredCards[i];
    filteredCards[i] = filteredCards[j];
    filteredCards[j] = tmp;
  }
  isFlipped = false;
  card.classList.remove('flipped');
  navigateTo(0, 'left');
}

card.addEventListener('click', flipCard);

var touchStartX = 0;
var cardContainer = document.querySelector('.card-container');
cardContainer.addEventListener('touchstart', function(e) {
  touchStartX = e.changedTouches[0].screenX;
}, { passive: true });
cardContainer.addEventListener('touchend', function(e) {
  var diff = touchStartX - e.changedTouches[0].screenX;
  if (Math.abs(diff) > 60) { if (diff > 0) nextCard(); else prevCard(); }
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft') prevCard();
  else if (e.key === 'ArrowRight') nextCard();
  else if (e.key === ' ') { e.preventDefault(); flipCard(); }
});

buildTopicBar();
buildPriorityRow();
renderCard();
</script>
</body>
</html>
